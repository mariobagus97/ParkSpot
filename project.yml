name: ParkSpot
options:
  bundleIdPrefix: com.mariobagus
  deploymentTarget: { iOS: "17.0" }
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
targets:
  ParkSpot:
    type: application
    platform: iOS
    sources: [ParkSpot]
    configFiles: { Debug: Config/Base.xcconfig, Release: Config/Base.xcconfig }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mariobagus.parkspot
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: ParkSpot
        UILaunchScreen: { UIColorName: LaunchBackground }
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "ParkSpot saves a photo with every spot so you can find your car where GPS can't."
        NSLocationWhenInUseUsageDescription: "ParkSpot uses your location to save where you parked and point you back to it. It never leaves your phone."
        ITSAppUsesNonExemptEncryption: false
  ParkSpotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ParkSpotUITests]
    dependencies: [{ target: ParkSpot }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mariobagus.parkspot.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: ParkSpot
        TARGETED_DEVICE_FAMILY: "1"
  ParkSpotTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ParkSpotTests]
    dependencies: [{ target: ParkSpot }]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.mariobagus.parkspot.tests, GENERATE_INFOPLIST_FILE: "YES", TARGETED_DEVICE_FAMILY: "1" } }
schemes:
  ParkSpot:
    build: { targets: { ParkSpot: all, ParkSpotTests: [test], ParkSpotUITests: [test] } }
    test: { targets: [ParkSpotTests, ParkSpotUITests] }
